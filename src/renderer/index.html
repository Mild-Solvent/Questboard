<!doctype html>
<html lang="en" data-theme="tavern">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;" />
  <title>Questboard</title>
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="ambient" aria-hidden="true"></canvas>

  <div id="app">
    <header id="titlebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Questboard</span>
        <span class="brand-sub" id="source-badge" title="Where the quest list came from"></span>
      </div>
      <div class="titlebar-actions">
        <button class="theme-switch" id="btn-theme" title="Switch theme (T)"><span class="seg seg-tavern">Tavern</span><span class="seg seg-abyss">Abyss</span></button>
        <button class="tb-btn" id="btn-sound" title="Sound on/off (M)"><span class="ico ico-sound"></span></button>
        <button class="tb-btn" id="btn-autostart" title="Launch when Windows starts"><span class="ico ico-bolt"></span><span class="tb-label" id="autostart-label">Startup</span></button>
        <span class="tb-sep"></span>
        <button class="tb-btn tb-win" id="btn-min" title="Minimize">&#x2013;</button>
        <button class="tb-btn tb-win tb-close" id="btn-hide" title="Hide to tray (keeps running)">&#x2715;</button>
      </div>
    </header>

    <section id="hero">
      <div class="hero-left">
        <div class="rank-crest" id="rank-crest" aria-hidden="true"><span id="level-num">1</span></div>
        <div class="rank-text">
          <div class="rank-title"><span id="rank-name">Tavern Squire</span></div>
          <div class="xp-row">
            <div class="xp-bar"><div class="xp-fill" id="xp-fill"></div><div class="xp-shine"></div></div>
            <div class="xp-label" id="xp-label">0 / 100 XP</div>
          </div>
        </div>
      </div>
      <div class="hero-right">
        <div class="stat"><div class="stat-num" id="stat-today">0</div><div class="stat-lbl">cleared today</div></div>
        <div class="stat"><div class="stat-num" id="stat-total">0</div><div class="stat-lbl">cleared total</div></div>
        <div class="stat"><div class="stat-num" id="stat-open">0</div><div class="stat-lbl">open quests</div></div>
      </div>
    </section>

    <main id="boards"></main>

    <footer id="footer">
      <span id="footer-hint">Click a rune to complete a quest. Right-click a quest to remove it. T = theme, M = sound.</span>
      <button class="link-btn" id="btn-reset-xp" title="Reset XP and level (quests stay)">reset xp</button>
      <button class="link-btn" id="btn-open-data" title="Open the folder with your quest file">quest file</button>
      <button class="link-btn hot" id="btn-update" hidden>restart to update</button>
      <span id="version"></span>
    </footer>
  </div>

  <div id="banner-layer" aria-live="polite"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <template id="tpl-group">
    <div class="board-wrap">
    <section class="board">
      <header class="board-head">
        <span class="board-glyph" aria-hidden="true"></span>
        <h2 class="board-title"></h2>
        <span class="board-count"></span>
      </header>
      <ul class="quests"></ul>
      <div class="notes"></div>
      <details class="done-wrap">
        <summary><span class="done-label">Completed</span> <span class="done-count"></span></summary>
        <ul class="quests done-list"></ul>
      </details>
      <div class="add-row">
        <button class="add-btn" type="button">+ new quest</button>
        <form class="add-form" hidden>
          <input class="add-input" type="text" maxlength="200" placeholder="What needs doing? Enter to add, Esc to cancel" autocomplete="off" />
        </form>
      </div>
    </section>
    </div>
  </template>

  <template id="tpl-quest">
    <li class="quest">
      <button class="rune" type="button" aria-label="Complete quest"><span class="rune-core"></span></button>
      <span class="quest-text"></span>
    </li>
  </template>

  <script src="fx.js"></script>
  <script src="sound.js"></script>
  <script src="app.js"></script>
</body>
</html>

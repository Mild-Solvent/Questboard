name: Build and release (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: questboard-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"; echo "v${{ steps.v.outputs.version }} already exists, bump package.json version to release."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installer and publish release
        if: steps.exists.outputs.released == 'false'
        run: npm run release
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        if: steps.exists.outputs.released == 'false'
        with:
          name: Questboard-Setup-${{ steps.v.outputs.version }}
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
